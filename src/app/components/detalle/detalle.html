<div style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  
  <!-- Spinner -->
  <div *ngIf="loading === true" style="text-align: center; padding: 60px;">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
    <p style="margin-top: 20px; color: #6b7280;">Cargando detalle del servicio...</p>
  </div>

  <!-- Detalle del servicio -->
  <div *ngIf="loading === false && servicio" style="background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <img [src]="servicio.imagen" [alt]="servicio.nombre" style="width:100%; height:400px; object-fit:cover;" (error)="servicio.imagen='assets/hero.jpg'">
    <div style="padding: 35px;">
      <h1 style="font-size: 32px; margin-bottom: 15px; color: #1f2937;">{{ servicio.nombre }}</h1>
      <p style="display: inline-block; padding: 6px 18px; border-radius: 25px; color: white; font-size: 13px; font-weight: 500; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px;" 
         [style.background]="servicio.categoria === 'web' ? '#3b82f6' : servicio.categoria === 'marketing' ? '#10b981' : '#f59e0b'">
        {{ servicio.categoria }}
      </p>
      <p style="font-size: 38px; color: #2563eb; font-weight: 700; margin: 20px 0;">${{ servicio.precio }}</p>
      <p style="line-height: 1.8; color: #4b5563; font-size: 16px; margin-bottom: 35px;">{{ servicio.descripcionCompleta }}</p>
      
      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <button (click)="toggleFavorito()" 
                style="padding: 12px 30px; background: linear-gradient(135deg, #2563eb, #1e40af); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: transform 0.2s;">
          {{ favoritosService.esFavorito(servicio.id) ? '❤️ Quitar de favoritos' : '🤍 Agregar a favoritos' }}
        </button>
        <button routerLink="/contacto" 
                style="padding: 12px 30px; background: #10b981; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: transform 0.2s;">
          📧 Contactar
        </button>
        <button routerLink="/servicios" 
                style="padding: 12px 30px; background: #6b7280; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: transform 0.2s;">
          ← Volver
        </button>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="loading === false && !servicio" style="text-align: center; padding: 60px; background: white; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="color: #dc2626; margin-bottom: 15px;">⚠️ Servicio no encontrado</h2>
    <p style="color: #6b7280; margin-bottom: 25px;">El servicio que buscas no existe o ha sido eliminado.</p>
    <button routerLink="/servicios" class="btn-primary" style="padding: 12px 30px;">Ver servicios</button>
  </div>
</div>

<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s;
  }
</style>
