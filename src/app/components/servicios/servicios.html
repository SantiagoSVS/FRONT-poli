<div style="padding: 40px 60px; min-height: 60vh;">
  <h1 style="text-align: center; margin-bottom: 30px; font-size: 32px; color: #1f2937;">📋 Nuestros Servicios</h1>
  
  <!-- Filtros -->
  <div style="text-align: center; margin-bottom: 40px;">
    <button (click)="filtrarPorCategoria('todos')" 
            [style.background]="categoriaSeleccionada === 'todos' ? '#2563eb' : 'white'"
            [style.color]="categoriaSeleccionada === 'todos' ? 'white' : '#2563eb'"
            style="margin: 5px; padding: 10px 28px; border: 2px solid #2563eb; border-radius: 30px; cursor: pointer; font-weight: 500; transition: all 0.3s;">
      Todos ({{ servicios.length }})
    </button>
    <button (click)="filtrarPorCategoria('web')"
            [style.background]="categoriaSeleccionada === 'web' ? '#2563eb' : 'white'"
            [style.color]="categoriaSeleccionada === 'web' ? 'white' : '#2563eb'"
            style="margin: 5px; padding: 10px 28px; border: 2px solid #2563eb; border-radius: 30px; cursor: pointer; font-weight: 500; transition: all 0.3s;">
      🌐 Web
    </button>
    <button (click)="filtrarPorCategoria('marketing')"
            [style.background]="categoriaSeleccionada === 'marketing' ? '#2563eb' : 'white'"
            [style.color]="categoriaSeleccionada === 'marketing' ? 'white' : '#2563eb'"
            style="margin: 5px; padding: 10px 28px; border: 2px solid #2563eb; border-radius: 30px; cursor: pointer; font-weight: 500; transition: all 0.3s;">
      📢 Marketing
    </button>
    <button (click)="filtrarPorCategoria('ecommerce')"
            [style.background]="categoriaSeleccionada === 'ecommerce' ? '#2563eb' : 'white'"
            [style.color]="categoriaSeleccionada === 'ecommerce' ? 'white' : '#2563eb'"
            style="margin: 5px; padding: 10px 28px; border: 2px solid #2563eb; border-radius: 30px; cursor: pointer; font-weight: 500; transition: all 0.3s;">
      🛒 Ecommerce
    </button>
  </div>

  <!-- Grid de tarjetas -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px;">
    <div *ngFor="let servicio of serviciosFiltrados" 
         style="background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); transition: transform 0.3s, box-shadow 0.3s;">
      <img [src]="servicio.imagen" [alt]="servicio.nombre" 
           style="width:100%; height:220px; object-fit:cover;" 
           (error)="servicio.imagen='assets/hero.jpg'">
      <div style="padding: 25px;">
        <h3 style="font-size: 20px; margin-bottom: 10px; color: #1f2937;">{{ servicio.nombre }}</h3>
        <p style="display: inline-block; padding: 5px 15px; border-radius: 20px; color: white; font-size: 12px; font-weight: 500; margin-bottom: 15px; text-transform: uppercase;" 
           [style.background]="servicio.categoria === 'web' ? '#3b82f6' : servicio.categoria === 'marketing' ? '#10b981' : '#f59e0b'">
          {{ servicio.categoria }}
        </p>
        <p style="color: #6b7280; line-height: 1.5; margin: 15px 0;">{{ servicio.descripcionBreve }}</p>
        <p style="font-size: 28px; color: #2563eb; font-weight: 700; margin: 20px 0;">${{ servicio.precio }}</p>
      </div>
      <div style="padding: 0 25px 25px 25px; display: flex; gap: 12px;">
        <button class="btn-primary" [routerLink]="['/detalle', servicio.id]" 
                style="flex: 1; padding: 12px; background: linear-gradient(135deg, #2563eb, #1e40af); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: transform 0.2s;">
          Ver detalles
        </button>
        <button (click)="toggleFavorito(servicio, $event)" 
                style="padding: 12px 20px; border: 2px solid #e5e7eb; background: white; border-radius: 12px; cursor: pointer; font-weight: 500; transition: all 0.2s;">
          {{ favoritosService.esFavorito(servicio.id) ? '❤️' : '🤍' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Mensaje cuando no hay servicios -->
  <div *ngIf="serviciosFiltrados.length === 0" style="text-align: center; padding: 60px; background: white; border-radius: 20px; margin-top: 30px;">
    <p style="font-size: 18px; color: #6b7280;">No hay servicios en la categoría "{{ categoriaSeleccionada }}".</p>
  </div>
</div>

<style>
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(37,99,235,0.3);
  }
  
  div[style*="grid-template-columns"] > div:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 30px rgba(0,0,0,0.12);
  }
  
  button[style*="padding: 12px 20px"]:hover {
    border-color: #2563eb;
    background: #fef2f2 !important;
  }
</style>
